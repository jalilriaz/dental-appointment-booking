<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Slate Navy Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Surgical Teal Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0D9488" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Tooth Enamel Pearlescent Gradient -->
    <linearGradient id="toothGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Diamond Star Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0D9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="34" fill="url(#bgGrad)" filter="url(#softGlow)" />
  <rect x="7" y="7" width="114" height="114" rx="33" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Stylized Geometric Anatomical Molar Crown & Roots -->
  <path
    d="M 64 26
       C 51 26, 41 29, 36 36
       C 30 45, 31 57, 34 70
       C 37 81, 44 102, 49 102
       C 53 102, 55 93, 60 84
       C 62 80, 66 80, 68 84
       C 73 93, 75 102, 79 102
       C 84 102, 91 81, 94 70
       C 97 57, 98 45, 92 36
       C 87 29, 77 26, 64 26 Z"
    fill="url(#toothGrad)"
  />

  <!-- Internal Enamel Glare Highlight -->
  <path
    d="M 46 38
       C 40 46, 40 58, 43 68
       C 45 60, 48 48, 56 42
       C 51 40, 48 38, 46 38 Z"
    fill="#FFFFFF"
    opacity="0.9"
  />

  <!-- Dynamic Smile Harmony Arc in Surgical Teal -->
  <path
    d="M 47 56 C 55 65, 73 65, 81 56"
    fill="none"
    stroke="#0D9488"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- 4-Point Radiant Sparkle Star (Top Right) -->
  <path
    d="M 94 22
       L 96.5 30.5
       L 105 33
       L 96.5 35.5
       L 94 44
       L 91.5 35.5
       L 83 33
       L 91.5 30.5 Z"
    fill="url(#sparkleGrad)"
  />

  <!-- Micro Accent Sparkle -->
  <circle cx="106" cy="22" r="2" fill="#5EEAD4" />
</svg>
